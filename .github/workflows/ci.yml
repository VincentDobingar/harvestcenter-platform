name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 57 pre-existing lint errors on main as of 2026-09-07 (undefined
      # `process`/`__dirname` in service/config files, a couple of
      # unused vars). Not introduced by this workflow. Kept non-blocking
      # until that's cleaned up — flip to a hard failure once
      # `npm run lint` is green.
      - run: npm run lint
        continue-on-error: true

      - run: npm run build

      # Kept as a build artifact so the deploy workflow (or a manual
      # download) doesn't have to rebuild from scratch.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  api:
    name: API (install check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      # No automated test suite exists yet (see the refonte plan, phase 1).
      # This step is a placeholder: once `npm test` is wired to a real
      # suite (Vitest/Supertest), swap the line below for `npm test` and
      # make it a required check before the deploy workflow can run.
      - run: node --check server.js && node --check app.js
