name: Deploy

# Manual trigger only, for now. Once a staging environment exists and the
# API has a real test suite (see the refonte plan, phases 1 and 4), this
# can be extended with an automatic `push: branches: [main]` trigger for
# staging while production stays manual/approval-gated.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Build & deploy (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    # Maps to a GitHub Environment of the same name (Settings > Environments).
    # Each environment holds its own copy of the secrets below, and
    # "production" can additionally require a manual approval reviewer.
    environment: ${{ github.event.inputs.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            frontend/dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_FRONTEND_PATH }}/"

      - name: Sync API source
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads' \
            --exclude 'tmp' \
            --exclude '.git' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            api/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_API_PATH }}/"

      - name: Install API deps & restart Passenger
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.REMOTE_API_PATH }}' && npm ci --omit=dev && mkdir -p tmp && touch tmp/restart.txt"

      - name: Health check
        run: |
          sleep 5
          curl -fsS "${{ secrets.HEALTH_URL }}" || (echo "Health check failed" && exit 1)
