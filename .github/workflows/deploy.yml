name: Deploy

# Manual trigger only, for now. Once a staging environment exists and the
# API has a real test suite (see the refonte plan, phases 1 and 4), this
# can be extended with an automatic `push: branches: [main]` trigger for
# staging while production stays manual/approval-gated.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Build & deploy (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    # Maps to a GitHub Environment of the same name (Settings > Environments).
    # Each environment holds its own copy of the secrets below, and
    # "production" can additionally require a manual approval reviewer.
    environment: ${{ github.event.inputs.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          # Overrides the committed .env (which points at the production
          # API) so each target builds against its own backend. VITE_*
          # vars are baked in at build time — there is no runtime config
          # switch (window.__RUNTIME_CONFIG__ is set in main.jsx but never
          # actually read anywhere in the app).
          echo "VITE_API_BASE_URL=${{ secrets.FRONTEND_API_BASE_URL }}" > .env.production.local
          echo "VITE_API_PREFIX=/api" >> .env.production.local
          npm ci
          npm run build

      - name: Generate environment-specific .htaccess for the frontend
        run: |
          # frontend/.htaccess isn't part of the Vite build output (it
          # lives outside src/public) and its /api proxy rule (and CSP
          # connect-src) are hardcoded to the production API host —
          # retarget them per environment before it gets rsynced
          # alongside dist/.
          sed "s#https://api.harvestcentertd.org#${{ secrets.FRONTEND_API_BASE_URL }}#g" \
            frontend/.htaccess > frontend/dist/.htaccess

      - name: Generate environment-specific .htaccess for the API
        run: |
          # api/.htaccess carries CloudLinux's PassengerAppRoot/PassengerNodejs
          # directives, which embed an absolute filesystem path that cPanel
          # assigns per Node app (different for staging vs production) —
          # fill them in from this environment's secrets, then let it be
          # rsynced like any other file below instead of hand-maintained
          # on the server (that manual-edit approach is how the hardening
          # rules added on 2026-09-07 never actually reached production).
          sed -e "s#__PASSENGER_APP_ROOT__#${{ secrets.REMOTE_API_PATH }}#g" \
              -e "s#__PASSENGER_NODEJS_PATH__#${{ secrets.PASSENGER_NODEJS_PATH }}#g" \
              api/.htaccess > api/.htaccess.generated
          mv api/.htaccess.generated api/.htaccess

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            frontend/dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_FRONTEND_PATH }}/"

      - name: Sync API source
        run: |
          # .htaccess is now templated per environment by the step above
          # and rsynced like any other file — see that step for why it
          # used to be excluded here.
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads' \
            --exclude 'tmp' \
            --exclude '.git' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            api/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_API_PATH }}/"

      - name: Install API deps & restart Passenger
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.REMOTE_API_PATH }}' && npm ci --omit=dev && mkdir -p tmp && touch tmp/restart.txt"

      - name: Health check
        run: |
          sleep 5
          curl -fsS "${{ secrets.HEALTH_URL }}" || (echo "Health check failed" && exit 1)
